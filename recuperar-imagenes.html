<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar imágenes | Checkpoint Select</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #111;
            color: white;
        }

        h1 {
            margin-bottom: 25px;
        }

        #exportar {
            padding: 12px 20px;
            margin-bottom: 10px;

            background: #ff6b2c;
            color: white;

            border: none;
            border-radius: 6px;

            font-weight: bold;
            cursor: pointer;
        }

        #exportar:hover {
            opacity: 0.9;
        }

        #estado {
            margin-bottom: 30px;
            color: #7cff8a;
            font-weight: bold;
        }

        .imagen {
            margin-bottom: 40px;
            padding: 20px;

            background: #1b1b1b;

            border-radius: 10px;
        }

        img {
            max-width: 400px;
            max-height: 300px;

            display: block;

            margin-top: 10px;
        }

        code {
            color: #ff7a32;
        }
    </style>
</head>


<body>

    <h1>Recuperar imágenes de Checkpoint Select</h1>

    <button id="exportar">
        EXPORTAR TODAS LAS IMÁGENES
    </button>

    <p id="estado"></p>

    <div id="resultado"></div>


    <script>

        // ==========================================
        // MOSTRAR LAS IMÁGENES GUARDADAS
        // ==========================================

        const peticion = indexedDB.open(
            "checkpoint-select-db",
            1
        );


        peticion.onerror = function () {

            document.getElementById("resultado").innerHTML =
                "<p>Error abriendo IndexedDB.</p>";

        };


        peticion.onsuccess = function () {

            const db = peticion.result;


            const transaccion =
                db.transaction(
                    "imagenes",
                    "readonly"
                );


            const almacen =
                transaccion.objectStore(
                    "imagenes"
                );


            const consulta =
                almacen.openCursor();


            const resultado =
                document.getElementById(
                    "resultado"
                );


            consulta.onsuccess = function (evento) {

                const cursor =
                    evento.target.result;


                if (!cursor) {
                    return;
                }


                const contenedor =
                    document.createElement("div");

                contenedor.className =
                    "imagen";


                const titulo =
                    document.createElement("p");


                titulo.innerHTML =
                    "<strong>Clave:</strong> <code>" +
                    cursor.key +
                    "</code>";


                const imagen =
                    document.createElement("img");


                imagen.src =
                    cursor.value;


                contenedor.appendChild(
                    titulo
                );


                contenedor.appendChild(
                    imagen
                );


                resultado.appendChild(
                    contenedor
                );


                cursor.continue();

            };

        };


        // ==========================================
        // EXPORTAR TODAS LAS IMÁGENES A JSON
        // ==========================================

        document
            .getElementById("exportar")
            .addEventListener(
                "click",
                function () {


                    const peticionExportar =
                        indexedDB.open(
                            "checkpoint-select-db",
                            1
                        );


                    peticionExportar.onerror =
                        function () {

                            document.getElementById(
                                "estado"
                            ).textContent =
                                "ERROR: No se pudo abrir la base de datos.";

                        };


                    peticionExportar.onsuccess =
                        function () {


                            const db =
                                peticionExportar.result;


                            const transaccion =
                                db.transaction(
                                    "imagenes",
                                    "readonly"
                                );


                            const almacen =
                                transaccion.objectStore(
                                    "imagenes"
                                );


                            const consulta =
                                almacen.openCursor();


                            const imagenes = {};


                            consulta.onsuccess =
                                function (evento) {


                                    const cursor =
                                        evento.target.result;


                                    if (cursor) {


                                        imagenes[
                                            cursor.key
                                        ] = cursor.value;


                                        cursor.continue();


                                    } else {


                                        const cantidad =
                                            Object.keys(
                                                imagenes
                                            ).length;


                                        const contenido =
                                            JSON.stringify(
                                                imagenes,
                                                null,
                                                2
                                            );


                                        const blob =
                                            new Blob(
                                                [contenido],
                                                {
                                                    type:
                                                        "application/json"
                                                }
                                            );


                                        const url =
                                            URL.createObjectURL(
                                                blob
                                            );


                                        const enlace =
                                            document.createElement(
                                                "a"
                                            );


                                        enlace.href =
                                            url;


                                        enlace.download =
                                            "checkpoint-select-imagenes-backup.json";


                                        document.body.appendChild(
                                            enlace
                                        );


                                        enlace.click();


                                        enlace.remove();


                                        URL.revokeObjectURL(
                                            url
                                        );


                                        document.getElementById(
                                            "estado"
                                        ).textContent =
                                            "¡Listo! Se han exportado " +
                                            cantidad +
                                            " imágenes.";

                                    }

                                };

                        };

                }
            );

    </script>

</body>

</html>
